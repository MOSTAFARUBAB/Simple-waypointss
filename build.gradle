plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.hasProperty('withRing') ? "${project.archives_base_name}-3d-beam-ring"
            : project.hasProperty('withBeam') ? "${project.archives_base_name}-3d-beam"
            : project.archives_base_name
}

// The real 3D beam lives in its own package and is only compiled with -PwithBeam=true.
sourceSets {
    main {
        java {
            if (!project.hasProperty('withBeam')) {
                exclude 'com/example/waypoints/beam/**'
            }
            // The ground ring is compiled only with -PwithRing=true, so a problem in it can never stop the beam jar.
            if (!project.hasProperty('withRing')) {
                exclude 'com/example/waypoints/beam/Ring3D.java'
            }
        }
    }
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
