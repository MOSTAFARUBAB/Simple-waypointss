name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - name: Build 3D beacon beam
        run: gradle clean build --no-daemon -PwithBeam=true
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: simple-waypoints-jar
          path: build/libs/*.jar
